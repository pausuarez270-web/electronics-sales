<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tecnologics Sale</title>
    
    <!-- Tailwind CSS por CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: "#1F2A24",
                        paper: "#F7F4EF",
                        cardbg: "#FFFFFF",
                        muted: "#888578",
                        teal: "#2F6F5E",
                        ochre: "#D9A441",
                        rust: "#B5502C",
                        sage: "#7C8B6F",
                        rose: "#B98F86",
                        reddis: "#D7263D",
                    },
                    fontFamily: {
                        display: ["Fraunces", "serif"],
                        sans: ["Inter", "sans-serif"],
                    },
                },
            },
        };
    </script>

    <!-- Enlace a tu archivo CSS personalizado -->
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-paper text-ink font-sans">

    <!-- Header / Navegación -->
    <header class="sticky top-0 z-50 bg-cardbg shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-8 h-16 flex items-center justify-between">
            <h1 class="font-display text-xl font-bold tracking-tight">Tecnologics Sale</h1>
            <nav class="hidden md:flex items-center gap-6 text-sm font-medium">
                <a href="#ofertas" class="hover:text-teal transition-colors">Ofertas</a>
                <a href="#tendencia" class="hover:text-teal transition-colors">Tendencia</a>
            </nav>
        </div>
    </header>
<main class="max-w-7xl mx-auto px-4 sm:px-8 pb-24 pt-14">
    <!-- Sección Ofertas -->
    <section id="ofertas" class="mb-12">
        <h2 class="text-2xl font-display font-semibold mb-2">Ofertas Destacadas</h2>
        <p class="text-text-muted mb-6">Los mejores precios en tecnología por tiempo limitado.</p>
        <div id="container-ofertas" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6"></div>
    </section>

    <!-- Sección Tendencia -->
    <section id="tendencia" class="mb-12">
        <h2 class="text-2xl font-display font-semibold mb-2">Tendencias</h2>
        <p class="text-text-muted mb-6">Lo más elegido de la temporada.</p>
        <div id="container-tendencia" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6"></div>
    </section>

    <!-- Sección Regalos para papá -->
    <section id="papa" class="mb-12">
        <h2 class="text-2xl font-display font-semibold mb-2">Regalos para Papá</h2>
        <p class="text-text-muted mb-6">Ideas especiales para sorprenderlo.</p>
        <div id="container-papa" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6"></div>
    </section>
</main>
 
    <!-- Enlace a tu archivo JavaScript principal -->
    <script src="js/main.js"></script>
</body>
</html>
