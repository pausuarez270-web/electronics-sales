<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tecnologics Sale</title>
    
    <!-- Tailwind CSS por CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Faustina:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Enlace a tu archivo CSS personalizado -->
    <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-paper text-ink font-sans">

    <!-- Header / Navegación -->
    <header class="sticky top-0 z-50 bg-cardbg shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-8 h-16 flex items-center justify-between">
            <h1 class="font-display text-xl font-bold tracking-tight">Tecnologics Sale</h1>
            <nav class="hidden md:flex items-center gap-6 text-sm font-medium">
                <a href="#ofertas" class="hover:text-teal transition-colors">Ofertas</a>
                <a href="#tendencia" class="hover:text-teal transition-colors">Tendencia</a>
            </nav>
        </div>
    </header>

    <!-- Contenedor principal donde actuará React -->
    <main class="max-w-7xl mx-auto px-4 sm:px-8 pb-24 pt-14">
        
        <!-- Aquí se montará tu app de React -->
        <div id="root"></div>

        <!-- Sección Tendencia (Estática de respaldo o contenedor de secciones) -->
        <section id="tendencia" class="mb-12">
            <h2 class="text-2xl font-display font-semibold mb-2">Tendencias</h2>
            <p class="text-text-muted mb-6">Lo más elegido de la temporada.</p>
            <div id="container-tendencia" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
        </section>

        <!-- Sección Regalos para papá -->
        <section id="papa" class="mb-12">
            <h2 class="text-2xl font-display font-semibold mb-2">Regalos para Papá</h2>
            <p class="text-text-muted mb-6">Ideas especiales para sorprender.</p>
            <div id="container-papa" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
        </section>

    </main>

    <!-- React, ReactDOM, Lucide Icons y Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Enlace a tu archivo JavaScript principal -->
    <script type="text/babel" src="main.js"></script>
</body>
</html>
